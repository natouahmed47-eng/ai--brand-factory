services:
  postgres:
    image: postgres:16-alpine
    container_name: abf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: abf_user
      POSTGRES_PASSWORD: abf_password
      POSTGRES_DB: abf_db
    ports:
      - "5433:5432"
    volumes:
      - abf_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: abf_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - abf_redis_data:/data

volumes:
  abf_postgres_data:
  abf_redis_data: